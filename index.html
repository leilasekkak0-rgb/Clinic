<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>عيادة طبية افتراضية خاصة | نظام إدارة الطب الشمولي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --emerald-900: #043927;
      --emerald-800: #064e3b;
      --emerald-700: #047857;
      --emerald-600: #059669;
      --emerald-100: #d1fae5;
      --emerald-50:  #ecfdf5;
      --gold-600:    #b48327;
      --gold-500:    #c59b27;
      --gold-400:    #d4af37;
      --gold-100:    #fef3c7;
      --cream-bg:    #faf9f5;
      --card-bg:     #ffffff;
      --text-main:   #1e293b;
      --text-muted:  #64748b;
      --border-soft: #e2e8f0;
      --danger:      #dc2626;
      --shadow-sm:   0 2px 8px rgba(4, 57, 39, 0.06);
      --shadow-md:   0 8px 24px rgba(4, 57, 39, 0.12);
      --radius-lg:   14px;
      --radius-md:   10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background-color: var(--cream-bg);
      color: var(--text-main);
    }

    /* Top Header Bar */
    .clinic-header {
      background: linear-gradient(135deg, var(--emerald-900) 0%, var(--emerald-800) 100%);
      color: #fff;
      padding: 14px 18px;
      border-bottom: 3px solid var(--gold-400);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-md);
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      max-width: 1360px;
      margin: 0 auto;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-emblem {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2px solid var(--gold-400);
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-family: 'Amiri', serif;
      font-size: 1.35rem;
      color: var(--gold-400);
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 0.78rem;
      color: #d1fae5;
      margin-top: 2px;
    }

    /* Practitioner Dropdown in Header */
    .practitioner-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(212, 175, 55, 0.5);
      padding: 6px 10px;
      border-radius: 10px;
      flex: 1;
      max-width: 440px;
      min-width: 260px;
    }

    .practitioner-bar label {
      font-size: 0.78rem;
      color: var(--gold-400);
      font-weight: 700;
      white-space: nowrap;
    }

    .practitioner-bar select {
      width: 100%;
      background: var(--emerald-900);
      color: #fff;
      border: 1px solid var(--gold-400);
      border-radius: 7px;
      padding: 6px 8px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Full Interactive Navigation Bar (No Hidden Drawer!) */
    .nav-bar-wrapper {
      background: #ffffff;
      border-bottom: 1px solid var(--border-soft);
      padding: 10px 14px;
      box-shadow: var(--shadow-sm);
    }

    .nav-grid-bar {
      max-width: 1360px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 8px;
    }

    .nav-tab-btn {
      background: var(--cream-bg);
      border: 1px solid var(--border-soft);
      color: var(--emerald-900);
      padding: 9px 10px;
      border-radius: 9px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-align: center;
    }

    .nav-tab-btn:hover {
      background: var(--emerald-50);
      border-color: var(--emerald-700);
    }

    .nav-tab-btn.active {
      background: var(--emerald-900);
      color: var(--gold-400);
      border-color: var(--gold-400);
      box-shadow: 0 2px 6px rgba(4, 57, 39, 0.2);
    }

    .nav-tab-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* Main Container */
    .container {
      max-width: 1360px;
      margin: 0 auto;
      padding: 18px 14px 40px;
    }

    .section-view {
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .section-view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-soft);
      border-top: 4px solid var(--emerald-800);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-card.gold { border-top-color: var(--gold-500); }
    .stat-label { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 4px; }
    .stat-value { font-size: 1.45rem; font-weight: 800; color: var(--emerald-900); }

    .stat-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--emerald-50);
      color: var(--emerald-800);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-soft);
      margin-bottom: 18px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-soft);
      flex-wrap: wrap;
      gap: 10px;
    }

    .card-title {
      font-size: 1.04rem;
      font-weight: 800;
      color: var(--emerald-900);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 16px;
    }

    @media (max-width: 860px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    /* Buttons */
    .btn {
      padding: 9px 15px;
      border-radius: 9px;
      border: none;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary { background: var(--emerald-800); color: #fff; }
    .btn-gold { background: linear-gradient(135deg, var(--gold-500), var(--gold-600)); color: #fff; }
    .btn-outline { background: #fff; border: 1px solid var(--emerald-800); color: var(--emerald-800); }
    .btn-sm { padding: 5px 10px; font-size: 0.78rem; }
    .btn-danger { background: #fee2e2; color: var(--danger); }

    /* Forms */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--emerald-900);
    }

    input, select, textarea {
      padding: 9px 11px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.88rem;
      background: #fff;
      color: var(--text-main);
      width: 100%;
    }

    /* Tables */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    th {
      background: var(--emerald-50);
      color: var(--emerald-900);
      font-weight: 700;
      text-align: right;
      padding: 10px 12px;
      border-bottom: 2px solid var(--gold-400);
      white-space: nowrap;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-soft);
      vertical-align: middle;
    }

    .badge {
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      display: inline-block;
    }
    .badge-sanguine   { background: #fee2e2; color: #991b1b; }
    .badge-choleric   { background: #fef3c7; color: #92400e; }
    .badge-phlegmatic { background: #e0f2fe; color: #075985; }
    .badge-melancholic{ background: #f3e8ff; color: #6b21a8; }

    .status-pill {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .status-waiting { background: #fef3c7; color: #92400e; }
    .status-active  { background: #d1fae5; color: #065f46; }
    .status-done    { background: #f1f5f9; color: #475569; }

    /* Progress Bars */
    .temp-bar-item { margin-bottom: 11px; }
    .temp-bar-head { display: flex; justify-content: space-between; font-size: 0.84rem; font-weight: 700; margin-bottom: 4px; }
    .temp-bar-track { height: 8px; background: #f1f5f9; border-radius: 999px; overflow: hidden; }
    .temp-bar-fill { height: 100%; border-radius: 999px; }

    /* Queue Banner */
    .queue-banner {
      background: linear-gradient(135deg, var(--emerald-900), var(--emerald-800));
      color: #fff;
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border: 1px solid var(--gold-400);
      flex-wrap: wrap;
      gap: 10px;
    }
    .queue-current-num { font-size: 1.8rem; font-weight: 800; color: var(--gold-400); }

    /* A4 Prescription Sheet */
    .rx-sheet {
      background: #fff;
      border: 2px solid var(--emerald-800);
      border-radius: 8px;
      padding: 20px;
      position: relative;
      box-shadow: var(--shadow-md);
    }
    .rx-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid var(--gold-400);
      padding-bottom: 10px;
      margin-bottom: 12px;
      gap: 8px;
    }
    .rx-clinic-name { font-family: 'Amiri', serif; font-size: 1.35rem; color: var(--emerald-900); }
    .rx-doctor-name { font-size: 0.88rem; font-weight: 700; color: var(--gold-600); margin-top: 2px; }
    .rx-meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--emerald-50);
      padding: 9px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.84rem;
    }
    .rx-block { margin-bottom: 12px; }
    .rx-block h4 {
      color: var(--emerald-900);
      background: #f8fafc;
      border-right: 4px solid var(--gold-500);
      padding: 5px 10px;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }
    .rx-block p { font-size: 0.86rem; line-height: 1.65; white-space: pre-line; padding-right: 6px; }
    .rx-footer {
      margin-top: 18px;
      padding-top: 10px;
      border-top: 1px dashed #cbd5e1;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Reference Cards */
    .ref-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }
    .ref-card {
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 15px;
      background: #fff;
      border-top: 4px solid var(--gold-500);
    }
    .ref-card h3 { color: var(--emerald-900); margin-bottom: 8px; font-size: 1rem; }
    .ref-card ul { padding-right: 16px; font-size: 0.84rem; line-height: 1.6; }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 57, 39, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1100;
      padding: 14px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: var(--radius-lg);
      max-width: 640px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      border-top: 5px solid var(--gold-400);
    }

    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area {
        position: fixed;
        inset: 0;
        width: 100%;
        background: #fff;
        padding: 14mm;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="clinic-header">
    <div class="header-top-row">
      <div class="brand-group">
        <div class="brand-emblem">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
        <div>
          <div class="brand-title" id="headerClinicName">عيادة طبية افتراضية خاصة</div>
          <div class="brand-sub" id="todayDateLabel">نظام الإدارة المتكامل للطب الشمولي</div>
        </div>
      </div>

      <!-- Practitioner Dropdown -->
      <div class="practitioner-bar">
        <label for="practitionerSelect">المعالج:</label>
        <select id="practitionerSelect" onchange="changePractitioner()">
          <option value="الدكتورة ليلى سكاك، معالجة بمنهج الطب الشمولي">الدكتورة ليلى سكاك، معالجة بمنهج الطب الشمولي</option>
          <option value="الدكتور إحسان حمدان، أخصائي طب شمولي">الدكتور إحسان حمدان، أخصائي طب شمولي</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Direct Interactive Navigation Grid (Always Visible & Accessible) -->
  <nav class="nav-bar-wrapper" aria-label="القائمة الرئيسية">
    <div class="nav-grid-bar">
      <button type="button" class="nav-tab-btn active" data-tab="dashboard" onclick="switchTab('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        الرئيسية
      </button>
      <button type="button" class="nav-tab-btn" data-tab="patients" onclick="switchTab('patients')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        الملفات الطبية
      </button>
      <button type="button" class="nav-tab-btn" data-tab="prescription" onclick="switchTab('prescription')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        الوصفة العلاجية
      </button>
      <button type="button" class="nav-tab-btn" data-tab="appointments" onclick="switchTab('appointments')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
        المواعيد والانتظار
      </button>
      <button type="button" class="nav-tab-btn" data-tab="labs" onclick="switchTab('labs')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6"/><path d="M10 3v6l-4 7a2 2 0 0 0 1.7 3h8.6a2 2 0 0 0 1.7-3l-4-7V3"/></svg>
        المخابر والصيدلية
      </button>
      <button type="button" class="nav-tab-btn" data-tab="finance" onclick="switchTab('finance')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        المحاسبة
      </button>
      <button type="button" class="nav-tab-btn" data-tab="reference" onclick="switchTab('reference')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        دليل الأمزجة
      </button>
      <button type="button" class="nav-tab-btn" data-tab="settings" onclick="switchTab('settings')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        الإعدادات
      </button>
    </div>
  </nav>

  <!-- Main Workspace -->
  <main class="container">

    <!-- 1. DASHBOARD -->
    <section id="view-dashboard" class="section-view active">
      <div class="stats-grid">
        <div class="stat-card">
          <div>
            <div class="stat-label">إجمالي الملفات الشمولية</div>
            <div class="stat-value" id="statTotalPatients">0</div>
          </div>
          <div class="stat-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          </div>
        </div>

        <div class="stat-card gold">
          <div>
            <div class="stat-label">جلسات واستشارات اليوم</div>
            <div class="stat-value" id="statTodayAppts">0</div>
          </div>
          <div class="stat-icon" style="background:#fef3c7;color:#92400e;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
          </div>
        </div>

        <div class="stat-card">
          <div>
            <div class="stat-label">الوصفات العلاجية الصادرة</div>
            <div class="stat-value" id="statTotalRx">0</div>
          </div>
          <div class="stat-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          </div>
        </div>

        <div class="stat-card gold">
          <div>
            <div class="stat-label">إجمالي الإيرادات المسجلة</div>
            <div class="stat-value" id="statTotalRevenue">0 د.ج</div>
          </div>
          <div class="stat-icon" style="background:#fef3c7;color:#92400e;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </div>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head
